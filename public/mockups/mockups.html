        <style>
            body {
                background-color: #09090b;
                color: #e5e1e4;
                overscroll-behavior-y: none;
            }
            .snap-y-container {
                scroll-snap-type: y mandatory;
                overflow-y: scroll;
                height: 100vh;
            }
            .snap-section {
                scroll-snap-align: start;
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            /* Mobile Device Mockup Outline */
            .device-mockup {
                width: 85%;
                max-width: 320px;
                aspect-ratio: 9 / 19.5;
                border: 1px solid #27272a;
                border-radius: 2rem; /* Softened for mobile frame aesthetic, distinct from global strict corners */
                overflow: hidden;
                background-color: #18181b;
                position: relative;
            }
            .device-notch {
                position: absolute;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 40%;
                height: 20px;
                background-color: #27272a;
                border-bottom-left-radius: 10px;
                border-bottom-right-radius: 10px;
                z-index: 10;
            }
            .content-frame {
                width: 100%;
                height: 100%;
                border: none;
            }

            /* Hide scrollbar for clean aesthetic */
            ::-webkit-scrollbar {
                display: none;
            }

            .chip {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 4px 8px;
                border: 1px solid #27272a;
                background: #18181b;
            }
        </style>
